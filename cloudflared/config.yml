# Named Cloudflare tunnel for TalkTua (backend serves the device client + /ws on one port).
# One-time setup, run from the repo root:
#   cloudflared tunnel login
#   cloudflared tunnel create talktua
#   copy the printed ~/.cloudflared/<TUNNEL_ID>.json to cloudflared/credentials.json (gitignored)
#   cloudflared tunnel route dns talktua talktua.example.com
# Run:
#   cloudflared tunnel --config cloudflared/config.yml run
tunnel: talktua
credentials-file: cloudflared/credentials.json

ingress:
  - hostname: talktua.example.com
    service: http://localhost:8000
  - service: http_status:404
