<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#fafafa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>talk2tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <video id="cam" autoplay playsinline muted></video>

  <header class="top">
    <div class="who">
      <div id="name" class="name">Point at something</div>
      <div id="object" class="object">then hold to talk</div>
    </div>
    <button id="reset" class="icon-btn" aria-label="Talk to a new object" title="New object">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </header>

  <footer class="bottom">
    <section id="captions" class="captions" aria-live="polite"></section>
    <div id="status" class="status">Connecting…</div>
    <div class="controls">
      <button id="keyboard" class="icon-btn" aria-label="Type instead" title="Type instead">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M7 16h10"/></svg>
      </button>
      <button id="talk" class="talk" aria-label="Hold to talk" disabled>
        <span class="talk-core"></span>
      </button>
      <button id="show-text" class="icon-btn" aria-label="Show text" aria-pressed="false" title="Show text">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="14" x="3" y="5" rx="2"/><path d="M7 15h4M15 15h2M7 11h2M13 11h4"/></svg>
      </button>
    </div>
    <form id="text-form" class="text-form" hidden>
      <input id="text-input" type="text" placeholder="Say something…" autocomplete="off" enterkeyhint="send">
      <button type="submit">Send</button>
    </form>
    <div id="mode" class="mode" hidden></div>
  </footer>

  <div id="start" class="start">
    <div class="wordmark">talk2tech</div>
    <div class="start-body">
      <h1>Talk to anything.</h1>
      <ol class="steps">
        <li>Point your camera at an object</li>
        <li>Hold the button and talk</li>
        <li>It wakes up and talks back</li>
      </ol>
    </div>
    <div class="start-foot">
      <p id="start-error" class="start-error"></p>
      <button id="start-btn">Start</button>
    </div>
  </div>

  <canvas id="debug-frame" class="debug-frame" hidden></canvas>

  <!-- Three.js is only fetched (by ar.js) when a WebXR AR session starts. -->
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
  <script type="module" src="app.js"></script>
</body>
</html>
